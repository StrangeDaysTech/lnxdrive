[package]
name = "lnxdrive-gnome"
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["Strange Days Tech, S.A.S. <contact@strangedays.tech>"]
license = "GPL-3.0-or-later"
description = "LNXDrive GNOME desktop integration"
repository = "https://github.com/StrangeDaysTech/lnxdrive"
rust-version = "1.75"

[[bin]]
name = "lnxdrive-gnome"
path = "src/main.rs"

[dependencies]
# GTK4 + libadwaita
gtk4 = "0.8"
libadwaita = "0.6"

# D-Bus communication with daemon (local path within the monorepo)
lnxdrive-ipc = { path = "../lnxdrive-engine/crates/lnxdrive-ipc" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# GIO integration
gio = "0.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
glib-build-tools = "0.19"
