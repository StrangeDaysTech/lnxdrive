[package]
name = "lnxdrive-gtk3"
version = "0.1.0"
edition = "2021"
authors = ["Strange Days Tech, S.A.S. <contact@strangedays.tech>"]
license = "GPL-3.0-or-later"
description = "LNXDrive GTK3 client for XFCE, Cinnamon, and MATE"
repository = "https://github.com/strangedaystech/lnxdrive-gtk3"
rust-version = "1.75"

[[bin]]
name = "lnxdrive-gtk3"
path = "src/main.rs"

[dependencies]
# GTK3
gtk = "0.18"

# System tray
libappindicator = "0.9"

# D-Bus communication with daemon
lnxdrive-ipc = { git = "https://github.com/strangedaystech/lnxdrive.git" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# GIO integration
gio = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
