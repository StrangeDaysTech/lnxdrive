    decisions_deferred: 0
    notes: "Sesión operador+agente 2026-05-28/29: (1) alcance estrechado a alpha GNOME-only; (2) UIs GTK3/Plasma/COSMIC archivadas a experimental/; (3) P0s bloquean release. Duración no medida (0 = sin dato)."

  # ---------- Effort ----------
  effort:
    started_at: "2026-05-29"
    finished_at: "2026-07-04"
    estimated_effort: "L (~5–7 semanas)"
    actual_effort: "L (~5.3 semanas, 6/7 fases ejecutadas)"
