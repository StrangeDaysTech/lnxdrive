# StrayMark Charter telemetry — CHARTER-01, filled at close (2026-07-04).
# Schema: .straymark/schemas/charter-telemetry.schema.v0.json
# Principio aplicado: gaps honestos > números inventados. Los conteos no medidos
# van en 0 con nota; las aproximaciones se marcan como tales.

charter_telemetry:
  # ---------- Identification ----------
  charter_id: "CHARTER-01"
  charter_title: "Road to v0.1.0-alpha.1"
  closed_at: "2026-07-04"

  # ---------- Origin & activation ----------
  originating_ailogs:
    - ailog_id: "AILOG-2026-05-29-001"
      still_relevant_at_execution: true
      relevance_notes: "El diagnóstico (engine ~70%, GNOME ~45%, 4 P0 sin mitigar, cero artefactos de release) se sostuvo durante toda la ejecución; el outline de fases se ejecutó 0–5 tal como se declaró. Lo que NO capturó el AILOG: que el gate terminal (tag por checklist de features) era conceptualmente incorrecto — eso emergió en el replanteo del 2026-07-04."

  trigger:
    declared_kind: "event_trigger"
    declared_description: "Auditoría del MVP (2026-05-28) + decisión del operador (2026-05-29) de embarcar un alpha enfocado GNOME-only con los P0 como bloqueantes de release."
    fired_at: "2026-05-29"
    fire_clarity: "clear"
    fire_clarity_notes: "Decisión explícita del operador tras auditoría; sin ambigüedad."

  # ---------- Pre-work ----------
  pre_work:
    items_declared: 0
    items_completed_before_planning: 0
    items_skipped: 0
    items_discovered_during_planning: 0
    pre_work_quality: "medium"
    pre_work_notes: "El formato v4 de este Charter no tenía sección §Pre-trabajo. El pre-work de facto fue la auditoría del 2026-05-28 (AILOG-2026-05-29-001). Calidad media: excelente para código/riesgos, ciega al defecto del gate (ningún criterio de capacidad)."

  # ---------- Planning session ----------
  planning_session:
    occurred: true
    duration_minutes: 0
    participants: 1
