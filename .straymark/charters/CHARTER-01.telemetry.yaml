      findings_by_category:
        hallucination: 0
        implementation_gap: 2
        real_debt: 4
        false_positive: 0
      audit_quality: "high"
      audit_notes: "H1 (wiring files-on-demand del CLI = FU-007), M2 (app-id Flatpak = FU-008), RD-2/3/4 (dep git remota = FU-009 cerrado; fechas tag-time = FU-010/011). + R1 emergente (copy overstatement, remediado pre-tag). Ver AILOG-2026-07-03-001."

  # ---------- Outcome & follow-ups ----------
  outcome:
    completed_as_planned: false
    scope_changes: "mayor"
    scope_change_notes: "F1 (IG): Fase 6 (tag firmado v0.1.0-alpha.1 + pre-release + anuncios) NO ejecutada — el gate del tag era conceptualmente incorrecto: hito definido como checklist de features + SemVer sin ningún criterio de capacidad, lo que permitió llegar a 'Fase 5 done' con el login GUI roto (StartAuth placeholder), sin refresh de token en runtime y sin detección de conflictos. Cierre por REDEFINICIÓN (decisión D4 del operador, 2026-07-04): el alpha se re-gatea como 'M1–M6 demostrables contra OneDrive real' y la ejecución pasa a CHARTER-02. No es fracaso de ejecución sino corrección de criterio; las Fases 0–5 entregaron con calidad auditada. F2: el GitHub project board del scope item 1 se creó y luego se eliminó como redundante (operador único; tracking en StrayMark + Issues). F3: drifts de alcance por fase documentados atómicamente en su momento (R6 superficie RISK-003, R7 main.rs/ipc en RISK-001, R8 Platform 47→49)."
    new_followups_generated: 15
    new_charters_created: 1
    charters_invalidated: 0
    associated_stage_id: ""

  # ---------- Qualitative ----------
  qualitative:
    format_iteration: "v4"
    friction_points:
      - "Hito terminal = checklist de features + tag SemVer, sin criterios de aceptación por capacidad — el defecto raíz que dejó el Charter sin cierre natural"
      - "Toda la pirámide de testing corre contra mock (incl. mock-dbus-daemon.py que fingía el login completo): estructuralmente imposible falsificar 'funciona'"
      - "Risk backlog público (23 issues, 5 P0) desconectado de los milestones — ningún tag lo tenía como gate"
      - "Validador StrayMark vs AILOGs en subdirectorios por componente (FU-015, deuda de tooling upstream)"
    wins:
      - "4 riesgos P0 de seguridad cerrados con auditoría externa multi-modelo (RISK-001/002/003, ISSUE-002)"
      - "T101: primer mount FUSE real del codebase — destapó 4 bugs funcionales de listing + 1 defecto de persistencia de inodes, todos corregidos con regresión"
      - "Patrón de actualización atómica del Charter ante drift funcionó de verdad (R6/R7/R8 backporteados en el mismo PR)"
      - "Registro de follow-ups adoptado y vivo (15 entradas trazables, 9 cerradas al cierre del Charter)"
      - "Arquitectura hexagonal validada por la implementación: el replanteo 2026-07-04 no tocó ni un puerto"
    overall_satisfaction: 3
    would_repeat_format: true
    proposed_format_changes: "Añadir criterios de aceptación por CAPACIDAD (guion de verificación ex-ante, 'el operador puede demostrar X contra el servicio real') a cada fase; regla dura: ningún hito de capacidad se cierra contra mock. Aplicado en CHARTER-02 (fases M0–M6). Ver new-guide/07-milestones-capacidad.md."
