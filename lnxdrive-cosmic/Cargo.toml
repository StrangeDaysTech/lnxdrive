[package]
name = "lnxdrive-cosmic"
version = "0.1.0"
edition = "2021"
authors = ["Enigmora <contact@enigmora.com>"]
license = "GPL-3.0-or-later"
description = "LNXDrive client for COSMIC Desktop"
repository = "https://github.com/enigmora/lnxdrive-cosmic"
rust-version = "1.75"

[[bin]]
name = "lnxdrive-cosmic"
path = "src/main.rs"

[dependencies]
# COSMIC/iced
iced = { version = "0.12", features = ["tokio"] }
libcosmic = { git = "https://github.com/pop-os/libcosmic" }

# D-Bus communication with daemon
lnxdrive-ipc = { git = "https://github.com/enigmora/lnxdrive.git" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
